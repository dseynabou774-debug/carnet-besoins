<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet des Besoins — Seyda Zeynab Academy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4F3C">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Besoins">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-deep: #0B4F3C;
    --emerald-mid: #1F6F54;
    --cream: #F7F1E1;
    --cream-2: #EFE6CE;
    --gold: #C9A227;
    --navy: #1C2B4A;
    --terracotta: #B5442E;
    --ink: #22301F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(11,79,60,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    font-family:'Work Sans', sans-serif;
    color: var(--ink);
    padding-bottom: 60px;
  }
  header{
    background: var(--emerald-deep);
    padding: 28px 20px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    bottom:0; left:0; right:0;
    height:6px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
  }
  header h1{
    font-family:'Playfair Display', serif;
    color: var(--cream);
    font-size: 1.5rem;
    margin: 0 0 4px;
    font-weight: 900;
    letter-spacing: 0.3px;
  }
  header .subtitle{
    color: var(--gold);
    font-family:'Space Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .envelope-summary{
    max-width: 720px;
    margin: -14px auto 0;
    padding: 0 16px;
  }
  .envelope-card{
    background: var(--navy);
    border-radius: 14px;
    padding: 18px 20px;
    color: var(--cream);
    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
  }
  .envelope-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 10px;
  }
  .envelope-row .label{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color: rgba(247,241,225,0.65);
  }
  .envelope-row .value{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:1.1rem;
  }
  .envelope-bar{
    height: 10px;
    border-radius: 6px;
    background: rgba(247,241,225,0.15);
    overflow:hidden;
    margin-top: 6px;
  }
  .envelope-bar-fill{
    height:100%;
    background: var(--gold);
    border-radius:6px;
    transition: width 0.4s ease;
  }
  .envelope-bar-fill.over{ background: var(--terracotta); }

  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 22px 16px 0;
  }

  .cap-setter{
    display:flex;
    align-items:center;
    gap: 8px;
    justify-content:center;
    margin-bottom: 18px;
    font-family:'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--emerald-deep);
  }
  .cap-setter input{
    width: 110px;
    padding: 6px 8px;
    border: 1.5px solid var(--emerald-mid);
    border-radius: 6px;
    font-family:'Space Mono', monospace;
    background: white;
    color: var(--ink);
    text-align:right;
  }
  .cap-setter button{
    background: var(--emerald-mid);
    color: white;
    border:none;
    border-radius: 6px;
    padding: 7px 12px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.78rem;
    cursor:pointer;
  }

  .category-card{
    background: white;
    border-radius: 14px;
    margin-bottom: 16px;
    padding: 16px 18px 14px;
    border: 1px solid rgba(11,79,60,0.12);
    box-shadow: 0 3px 10px rgba(11,79,60,0.06);
    position:relative;
  }
  .category-card::before{
    content:"";
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:4px;
    border-radius: 4px;
    background: var(--cat-color, var(--emerald-mid));
  }
  .category-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 8px;
    padding-left: 8px;
  }
  .category-name{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size: 1.05rem;
    color: var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .category-amounts{
    font-family:'Space Mono', monospace;
    font-size: 0.85rem;
    text-align:right;
  }
  .category-amounts .spent{
    font-weight:700;
    color: var(--emerald-deep);
  }
  .category-amounts .cap{
    color: #8a8a7a;
    font-size:0.72rem;
  }
  .mini-bar{
    height:7px;
    border-radius:5px;
    background: var(--cream-2);
    overflow:hidden;
    margin: 6px 8px 10px;
  }
  .mini-bar-fill{
    height:100%;
    background: var(--cat-color, var(--emerald-mid));
    border-radius:5px;
    transition: width 0.4s ease;
  }
  .mini-bar-fill.over{ background: var(--terracotta); }

  .add-row{
    display:flex;
    gap:6px;
    padding-left: 8px;
    margin-bottom: 6px;
  }
  .add-row input{
    border: 1.5px solid #ddd4b8;
    border-radius: 6px;
    padding: 7px 8px;
    font-family:'Work Sans', sans-serif;
    font-size: 0.82rem;
    background: var(--cream);
  }
  .add-row input.desc{ flex: 1.4; min-width:0; }
  .add-row input.amount{ flex: 0.8; font-family:'Space Mono', monospace; }
  .add-row button{
    background: var(--gold);
    color: var(--navy);
    border:none;
    border-radius: 6px;
    padding: 0 12px;
    font-weight:700;
    font-size: 0.9rem;
    cursor:pointer;
    flex-shrink:0;
  }

  .tx-list{
    padding-left: 8px;
    margin-top: 4px;
  }
  .tx-item{
    display:flex;
    justify-content:space-between;
    font-size: 0.8rem;
    padding: 5px 0;
    border-bottom: 1px dashed #e5dcc0;
    color: #444;
  }
  .tx-item:last-child{ border-bottom:none; }
  .tx-item .tx-desc{ flex:1; }
  .tx-item .tx-date{ color:#999; font-family:'Space Mono', monospace; font-size:0.7rem; margin-right:8px; }
  .tx-item .tx-amount{ font-family:'Space Mono', monospace; font-weight:600; color: var(--emerald-deep); }
  .tx-item .tx-del{
    background:none; border:none; color:#c48; cursor:pointer; font-size:0.85rem; margin-left:8px;
  }
  .tx-empty{
    font-size: 0.75rem;
    color: #b0a888;
    font-style: italic;
    padding: 4px 0 2px;
  }

  footer{
    text-align:center;
    padding: 24px 16px 10px;
    font-family:'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--emerald-mid);
    letter-spacing:0.5px;
  }
  footer .heart{ color: var(--terracotta); }

  .reset-link{
    display:block;
    text-align:center;
    margin: 4px auto 0;
    font-size: 0.72rem;
    color: #999;
    text-decoration: underline;
    cursor:pointer;
    background:none;
    border:none;
  }
</style>
</head>
<body>

<header>
  <h1>Carnet des Besoins</h1>
  <div class="subtitle">Besoins &amp; Vie Quotidienne · Orange Money</div>
</header>

<div class="envelope-summary">
  <div class="envelope-card">
    <div class="envelope-row">
      <span class="label">Enveloppe du mois</span>
      <span class="value" id="envelope-cap-display">— F CFA</span>
    </div>
    <div class="envelope-row">
      <span class="label">Total dépensé</span>
      <span class="value" id="envelope-spent-display">0 F CFA</span>
    </div>
    <div class="envelope-bar">
      <div class="envelope-bar-fill" id="envelope-bar-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<main>
  <div class="cap-setter">
    <span>Enveloppe totale du mois :</span>
    <input type="number" id="cap-input" placeholder="ex: 150000">
    <button onclick="setEnvelopeCap()">Fixer</button>
  </div>

  <div id="categories"></div>

  <div style="display:flex; gap:14px; justify-content:center; margin-top:6px;">
    <button class="reset-link" onclick="exportData()">Exporter mes données</button>
    <button class="reset-link" onclick="document.getElementById('import-file').click()">Importer des données</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  <button class="reset-link" onclick="resetMonth()">Réinitialiser le mois</button>
</main>

<footer>
  <div><span class="heart">♥</span> ÉPARGNER AUJOURD'HUI, RÉALISER DEMAIN.</div>
</footer>

<script>
const CATEGORIES = [
  { id: 'alimentation', name: 'Alimentation / Marché', icon: '🍚', color: '#1F6F54' },
  { id: 'factures', name: 'Factures (élec, eau, forfait)', icon: '💡', color: '#1C2B4A' },
  { id: 'transport', name: 'Transport', icon: '🚗', color: '#C9A227' },
  { id: 'sante', name: 'Santé', icon: '🏥', color: '#B5442E' },
  { id: 'menage', name: 'Ménage / Hygiène', icon: '🧴', color: '#6B8E23' },
  { id: 'scolaire', name: 'Fournitures scolaires', icon: '📚', color: '#7A5C9E' },
  { id: 'divers', name: 'Divers / Imprévus', icon: '🕌', color: '#8a6a3a' }
];

let state = {
  cap: 0,
  transactions: {} // { categoryId: [ {desc, amount, date}, ... ] }
};

const STORAGE_KEY = 'besoins-tracker-state';

async function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const loaded = JSON.parse(saved);
      state = Object.assign({cap:0, transactions:{}}, loaded);
    }
  }catch(e){
    console.log('Aucune donnée sauvegardée trouvée, démarrage à zéro.');
  }
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

function fmt(n){
  return Math.round(n).toLocaleString('fr-FR') + ' F CFA';
}

function categorySpent(catId){
  const txs = state.transactions[catId] || [];
  return txs.reduce((sum, t) => sum + Number(t.amount), 0);
}

function totalSpent(){
  return CATEGORIES.reduce((sum, c) => sum + categorySpent(c.id), 0);
}

function setEnvelopeCap(){
  const input = document.getElementById('cap-input');
  const val = Number(input.value);
  if(!val || val <= 0){ return; }
  state.cap = val;
  input.value = '';
  saveState();
  render();
}

function addTransaction(catId){
  const descInput = document.getElementById('desc-' + catId);
  const amountInput = document.getElementById('amount-' + catId);
  const desc = descInput.value.trim();
  const amount = Number(amountInput.value);
  if(!desc || !amount || amount <= 0){ return; }

  if(!state.transactions[catId]) state.transactions[catId] = [];
  const today = new Date();
  const dateStr = today.getDate().toString().padStart(2,'0') + '/' + (today.getMonth()+1).toString().padStart(2,'0');
  state.transactions[catId].push({ desc, amount, date: dateStr });

  descInput.value = '';
  amountInput.value = '';
  saveState();
  render();
}

function deleteTransaction(catId, idx){
  state.transactions[catId].splice(idx, 1);
  saveState();
  render();
}

function resetMonth(){
  if(!confirm('Réinitialiser toutes les dépenses du mois ? L\'enveloppe fixée sera conservée.')) return;
  state.transactions = {};
  saveState();
  render();
}

function exportData(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const dateStr = today.getFullYear() + '-' + (today.getMonth()+1).toString().padStart(2,'0') + '-' + today.getDate().toString().padStart(2,'0');
  a.href = url;
  a.download = 'besoins-' + dateStr + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const loaded = JSON.parse(e.target.result);
      if(confirm('Importer ces données ? Cela remplacera le carnet actuel sur cet appareil.')){
        state = Object.assign({cap:0, transactions:{}}, loaded);
        saveState();
        render();
      }
    }catch(err){
      alert('Fichier invalide. Assure-toi d\'avoir choisi un fichier exporté depuis ce carnet.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function render(){
  document.getElementById('envelope-cap-display').textContent = state.cap ? fmt(state.cap) : '— F CFA';
  const spent = totalSpent();
  document.getElementById('envelope-spent-display').textContent = fmt(spent);
  const pct = state.cap ? Math.min(100, (spent / state.cap) * 100) : 0;
  const fillEl = document.getElementById('envelope-bar-fill');
  fillEl.style.width = pct + '%';
  fillEl.classList.toggle('over', state.cap > 0 && spent > state.cap);

  const container = document.getElementById('categories');
  container.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const catSpent = categorySpent(cat.id);
    const txs = state.transactions[cat.id] || [];
    const catShare = state.cap ? state.cap / CATEGORIES.length : 0; // soft reference only, not enforced cap

    const card = document.createElement('div');
    card.className = 'category-card';
    card.style.setProperty('--cat-color', cat.color);

    let txHtml = '';
    if(txs.length === 0){
      txHtml = '<div class="tx-empty">Aucune dépense enregistrée</div>';
    } else {
      txHtml = txs.map((t, idx) => `
        <div class="tx-item">
          <span class="tx-date">${t.date}</span>
          <span class="tx-desc">${escapeHtml(t.desc)}</span>
          <span class="tx-amount">${fmt(t.amount)}</span>
          <button class="tx-del" onclick="deleteTransaction('${cat.id}', ${idx})">✕</button>
        </div>
      `).join('');
    }

    card.innerHTML = `
      <div class="category-head">
        <div class="category-name">${cat.icon} ${cat.name}</div>
        <div class="category-amounts">
          <div class="spent">${fmt(catSpent)}</div>
        </div>
      </div>
      <div class="add-row">
        <input type="text" class="desc" id="desc-${cat.id}" placeholder="Description">
        <input type="number" class="amount" id="amount-${cat.id}" placeholder="Montant">
        <button onclick="addTransaction('${cat.id}')">+</button>
      </div>
      <div class="tx-list">${txHtml}</div>
    `;
    container.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>

</body>
</html>
